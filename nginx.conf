server {
    listen 80;

    # Only the playlist and guide feeds are public. To reach the editor through this proxy as well,
    # change the regex location below to `location /` and delete the 404 block.
    location ~ ^/(playlist\.m3u|epg\.xml|u/) {
        proxy_pass http://guideforge:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
